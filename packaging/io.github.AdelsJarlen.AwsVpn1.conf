<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.AdelsJarlen.AwsVpn1"/>
  </policy>
  <!-- Anyone may read state and call methods; every mutating method is
       additionally authorized through polkit inside the daemon. -->
  <policy context="default">
    <allow send_destination="io.github.AdelsJarlen.AwsVpn1"
           send_interface="io.github.AdelsJarlen.AwsVpn1"/>
    <allow send_destination="io.github.AdelsJarlen.AwsVpn1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.AdelsJarlen.AwsVpn1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
