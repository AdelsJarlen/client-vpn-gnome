name: Maintenance

on:
  schedule:
    - cron: "17 6 * * 1"         # weekly (Mon 06:17 UTC): new OpenVPN releases
    - cron: "0 7 6 1,4,7,10 *"   # quarterly (6 Jan/Apr/Jul/Oct 07:00 UTC): checklist issue
  workflow_dispatch:
    inputs:
      mode:
        description: Which check to run
        type: choice
        options: [openvpn, quarterly]
        default: openvpn

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run maintenance check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 7 6 1,4,7,10 *' && 'quarterly' || 'openvpn') }}
        run: python3 scripts/maintenance_check.py --mode "$MODE"
